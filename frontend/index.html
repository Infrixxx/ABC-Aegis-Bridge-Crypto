<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Aegis Bridge — Merchant terminal</title>
    <script>
      // Apply saved display preferences before first paint to avoid a theme flash.
      try {
        var p = JSON.parse(localStorage.getItem("abc.prefs.v1") || "{}");
        var r = document.documentElement;
        var dark =
          p.theme === "dark" ||
          ((!p.theme || p.theme === "system") &&
            window.matchMedia("(prefers-color-scheme: dark)").matches);
        r.classList.toggle("dark", dark);
        r.style.colorScheme = dark ? "dark" : "light";
        r.dataset.palette = p.palette || "standard";
        r.dataset.text = p.textSize || "md";
        r.dataset.contrast = p.contrast ? "more" : "normal";
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
